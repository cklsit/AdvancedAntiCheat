  aimbot_spectrum:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  knockback_entropy:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  anti_knockback:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_armor:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_potion:
    enabled: true
    maxViolations: 4
    banTime: "3d"

  # ---- 三、挖掘与建筑类 ----
  fast_break:
    enabled: true
