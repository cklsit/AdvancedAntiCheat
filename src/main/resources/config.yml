# 玩家提示节流：控制 DecisionActionCenter 向玩家发送聊天提示的频率。
# 重要：节流只影响"聊天栏文字"，不影响实际处罚动作（封禁/验证码/监控一律照常立即执行）。
notify:
  # 绝对下限（毫秒）：任何提示对同一玩家的最小间隔，优先级最高。
  throttleMs: 5000
  # 以下为"同一档位持续存在时的重复提示间隔"（秒）；档位升高（升级）时会立即提示，不受此限制。
  # 设为 0 表示该档位只提示一次，之后不再重复（推荐：监控/正常 档位设为 0 可彻底消除刷屏）。
  normalRepeatSecs: 0
  monitorRepeatSecs: 0
  captchaRepeatSecs: 60
  tempBanRepeatSecs: 300
  banRepeatSecs: 600

ban:
  minTime: "1m"
  maxTime: "1d"
  # 融合决策（DecisionActionCenter）TEMP_BAN 档的自动封禁时长。
  # 融合分 RCP 升到"临时封禁"档位时自动执行；取值 "30m"/"1h"/"1d"/"permanent"。
  autoTempBanTime: "1h"

database:
  # 后端二选一：
  #   h2         = 嵌入式（默认）。零运维，跟着插件数据目录走，适合单服/开局/兜底。
  #   postgresql = 外置。多服共用一套库、或要直接用 SQL 看板时才需要。
  #
  # 两者**共用同一套表结构与 SQL**（时间列都是 BIGINT epoch 毫秒、IP/CIDR 用字符串、
  # 网段匹配在插件内做），所以切换后端不需要改任何代码，也不会出现"某个后端少列"。
  #
  # ⚠ 连接/建表失败**不会**禁用插件：反作弊照常判定与告警，只是不再落库，
  #   日志出现一条 WARN（只打一次、不刷屏、不打堆栈）。H2 用作保底正是这个原因。
  type: "h2"

  h2:
    # 库文件放在插件数据目录下：plugins/AdvancedAntiCheat/<path>.mv.db
    # ⚠ 换了后缀 -v2：旧版本建过的库结构与本次完全不同，另起一个文件
    #   比"读旧库然后逐列升级"更可靠（反作弊的历史数据没有兼容价值）。
    path: "anticheat-v2"

  postgres:
    host: "127.0.0.1"
    port: 5432
    database: "anticheat"
    username: "anticheat"
    password: ""
    # 连接池：写入是"批量 + 异步"的，池子不需要大；4 个连接足够支撑
    # 每 5 秒一次批量写入 + 偶发查询
    pool-size: 4
    connection-timeout-ms: 5000

  # 建表/升级由插件自己做（schema_version 表记录已执行的版本，幂等）
  auto-migrate: true
  # 断开/失败后的重连退避（秒）。失败会按这个间隔重试，不做指数退避以免日志难读
  reconnect-delay-seconds: 30

  # 写入 ban / violation 的"子服名"（多服共用一套库时用来区分来源）
  server-name: "Server-1"

  # 违规落库：攒够 batch-size 条或到 flush-interval-ms 就写一次。
  # queue-capacity 满了直接丢弃并计数——**绝不阻塞主线程或收包线程**。
  violation:
    batch-size: 64
    flush-interval-ms: 5000
    queue-capacity: 4096

  # 统计与分析
  stats:
    # 检查命中率统计桶（写入 check_stat：evaluations/flags）
    bucket-minutes: 5
    # 风险评分重算周期（分钟）
    risk-refresh-minutes: 10

  # 离线 IP 情报：按网段给 ASN / 国家。**不做任何外部查询**（本插件禁止外联）。
  # 网段匹配按最长前缀优先；没命中就留空。
  ip-intel:
    rules:
      - cidr: "10.0.0.0/8"
        asn: 0
        org: "LAN"
        country: "LAN"
      - cidr: "192.168.0.0/16"
        asn: 0
        org: "LAN"
        country: "LAN"
      - cidr: "172.16.0.0/12"
        asn: 0
        org: "LAN"
        country: "LAN"
      - cidr: "fc00::/7"
        asn: 0
        org: "LAN"
        country: "LAN"

check-client:
  timeout-minutes: 60

# ============ 漏洞赏金沙箱（bounty）============
# 定位是"化敌为友"：与其让外挂作者在暗处破坏，不如给他们一个光明正大的渠道
# 把成果上交换奖励。沙箱内**关闭自动惩罚**，但检测照常运行并打分——
# 没有检测证据的沙箱等于没有意义（那会让每次任务都只能判"绕过成功"）。
bounty:
  enabled: true
  # 每个玩家每天的沙箱额度（秒）。跨天自动重置（按 (玩家, 天) 落库，不是内存计数）。
  daily-limit-seconds: 1800
  # 兼容旧键：daily-limit-seconds 缺省时回退到它（分钟）
  default-time-limit-minutes: 30
  # 进入沙箱后自动打开任务板
  board-on-enter: true
  # 聊天隔离：沙箱内玩家只看到沙箱内的消息（主世界也看不到沙箱发言）
  isolate-chat: true
  # 沙箱内允许执行的命令（其余一律拦截，防止 op/ban/reload 等被注入执行）
  allowed-commands:
    - bounty
    - help
    - list
    - msg
    - tell
    - r
    - reply
    - who

  # ---------------- 判定参数 ----------------
  tuning:
    # 判定"被检测到"所需的最低 VL。默认与惩罚阶梯首档的证据门槛一致(8.0)，
    # 避免出现"惩罚认它、赏金不认它"这种自相矛盾的口径。
    detected-min-vl: 8.0
    # 多维异常分（0~100）达到多少算"绕过"（中置信）
    bypass-anomaly: 55.0
    # 达到多少算"高危零日发现"
    zero-day-anomaly: 80.0

  # ---------------- 自动调参（BYPASSED 时自动收紧检测阈值）----------------
  # ⚠ 默认关闭。开启前请先读 artifacts/auto-tune-design.md 第四节。
  #
  # 做什么：判定出一次**可信的**绕过时，自动把最相关的那个检测阈值收紧一小步，
  #         写进 check_rule.thresholds 并热生效——不需要人工改配置文件。
  # 不做什么：只吃 MEDIUM 及以上的置信度（LOW 档的「完成目标」不携带作弊信息，
  #         因为任务目标可能人肉就能完成）；只调数值、不碰判定逻辑；
  #         只降不升且一次最多 10%；不越过检测代码里声明的硬下限；有观察期回滚。
  #
  # ⚠ 这是一条可被反向利用的回路：作弊者能故意触发 BYPASSED，把阈值一路推低，
  #   直到正常玩家开始被误报。上面那几条约束就是为此存在的，缺一条都不该打开。
  auto-tune:
    # 总开关。
    enabled: false
    # 影子模式：完整跑归因与计算，但**不写库**，只把「本来会改成什么」记进 audit_log。
    # 强烈建议先用这个姿势空跑一到两周，确认虚拟调整的频率与幅度都合理，再关掉它。
    shadow: true
    # 归因门槛：证据得分要达到当前阈值的这个比例，才认为「该判据就是目标」。
    # 调高 = 更保守（宁可漏调）；调低 = 更容易触发，但指错检测的风险上升。
    min-attribution: 0.70
    # 单次最大收紧幅度（占当前阈值的比例）。一次调到位会把归因偏差直接变成误报。
    max-step: 0.10
    # 新阈值相对证据得分留多少余量（1.10 = 留 10%）。
    safety-margin: 1.10
    # 同一个检测两次自动调整之间的冷却（小时）。
    cooldown-hours: 24
    # 全局每日调整次数上限。
    max-per-day: 3
    # 调整后的观察期（小时）。到期结算一次，违规量暴涨就自动回滚到调整前的值。
    observe-hours: 6
    # 回滚阈值：观察期内该检测的违规条数超过「调整前同时长基线」的这个倍数即回滚。
    rollback-violation-factor: 3.0
    # 允许参与自动调参的检测。只有「判据已纯逻辑化」的检测能被重放归因，
    # 其余（ReachA / FlyA / NukerA 等需要实体位置与方块的）只能走人工闸门。
    allow:
      - AimC
      - AutoClickerD
      - SpeedB

  reward:
    # 被检测到时的保底赏金（证明现有规则有效）
    base: 1
    # 绕过档 = 任务名义赏金 × 该倍率
    bypass-multiplier: 1.0
    # 高危档固定赏金
    zero-day: 500

  # ---------------- 人类基线 ----------------
  # 基线由**主世界玩家**（非沙箱）提供，用来回答"这个人的多维行为是否偏离人类"。
  # ⚠ 这是统计判据：基线未就绪时判定会回落成"只看检测证据"并标注低置信度，
  #   而**不会**把"我们不知道"当成"他很清白"。上线初期建议先只观察 /bounty pending。
  baseline:
    enabled: true
    # 单个指标参与判定所需的最少观测数（攒够之前基线视为"未就绪"）
    min-samples: 200
    # 至少要有这么多个指标可用，才认为基线就绪
    min-ready-metrics: 2
    # 采样间隔（tick）。20 = 每秒一次
    sample-interval-ticks: 20
    # 每个玩家的统计窗口（tick）。攒满算一组指标后清空重攒——
    # 不重叠窗口是为了样本独立（滚动窗口会让"样本数"虚高而信息量不变）
    window-ticks: 200
    # 基线落库间隔（秒）
    save-interval-seconds: 300
    # 最多同时跟踪多少个玩家的窗口
    max-tracked-players: 40
    # 惊奇度累计到多少算异常分满格（≈ 3 个指标各自 p≈1e-4 的联合）
    full-scale-surprise: 12.0

  world:
    # 服务器重启时是否删除并重建 bounty_world。
    # false（默认）= 复用；无论哪种情况，启动时都会清空该世界的非玩家实体。
    reset-on-start: false

# ============ 蜜罐与陷阱（第七大类 5 项检测） ============
honeypot:
  enabled: true
  # 幻象矿石：向玩家发送假钻石矿坐标，挖掘即判透视
  hologram-ore:
    enabled: true
    count: 20
    worlds: ["world"]
  # 幽灵实体：不可见生物，被攻击/锁定即判 ESP/杀戮光环
  ghost-entity:
    enabled: true
    count: 10
    worlds: ["world"]
  # 不可能破坏进度：瞬挖/过短挖掘耗时判定脚本化
  impossible-break:
    enabled: true
    max-distance: 4.5
  # 虚假掉落物：投放仅自动拾取/ESP 才会收集的诱饵
  fake-drop:
    enabled: true
  # 假逃脱蜜罐：确认作弊者重定向沙箱并记录情报
  fake-escape:
    enabled: false
    threshold: 10
    sandbox-world: ""

# ============ 行为分析与自适应学习（第八大类 5 项检测） ============
# 说明：全局异常（孤立森林）/ 操作生物特征 / 反侦察 由 com.anticheat.ai 承载，
# 阈值见各模块常量。旧引擎的融合中心（贝叶斯 / RCP）已随它一起移除。
behavior:
  # 行为检测总开关（伪「站桩/挂机比」与界面交互异常检查）。
  # 关闭后 BehaviorListener 不再做这两项抽样判定（其他行为分析子模块不受影响）。
  enabled: true
  global-anomaly:
    enabled: true
  keystroke:
    enabled: true
  anti-recon:
    enabled: true
  # 行为异常控制台日志的复报间隔（秒）。
  # BehaviorAnalysisEngine 由 100ms 检测循环驱动，同一异常若不节流会每秒刷约 10 行 INFO 日志。
  # 0 = 每个玩家只输出一次（最安静）；-1 以外的负数同样按"只输出一次"处理。
  anomalyLogCooldownSecs: 60

# ============ AI 实验室（双模驱动 / 持续学习 / 人机协同闭环） ============
# 双模驱动：规则引擎（高精度）+ AI 异常检测（广覆盖）并行，评分经 RCP 融合。
# 持续学习：每玩家在线 K-Means 个人基线 + 全局孤立森林（未知作弊）+ 监督逻辑回归（标签闭环）。
# 轻量级：全部模型在异步线程运算，主线程仅做 O(1) 快照；每玩家内存 < 5KB。
# 可插拔：ailab.enabled=false 即整段关闭，退化为纯规则模式，无任何额外开销。
ailab:
  enabled: true
  # 特征采样：每 20 tick（1 秒）主线程快照 + 异步特征计算
  features:
    dims: 48                # 特征维度（当前版本固定 48）
  baseline:
    # 玩家个人行为基线（Online K-Means，K=3 中心）
    enabled: true
    warmup-samples: 300     # warmup 样本数（1Hz 采样 → 300 ≈ 5 分钟），期间不产出个人异常分
  forest:
    # 全局孤立森林（无监督，识别未知作弊）
    enabled: true
    trees: 100              # 树数量
    sample-size: 256        # 每棵树子采样
    height-limit: 8         # 树高限制
    history-capacity: 2000  # 特征历史库容量（最近 24h 建模窗口）
  cluster:
    # 新作弊集群发现：高分 + 特征靠近 → 集群 + 特征指纹
    enabled: true
    score-threshold: 0.75   # 全局异常分入选线
    cosine-threshold: 0.85  # 特征余弦相似度归并线
    ttl-minutes: 120        # 集群过期时间
  adaptive:
    # PID 自适应阈值调节器（误报率闭环，目标 < 0.5%）
    window-size: 50         # 反馈滑动窗口
  supervised:
    # 监督分类器（逻辑回归）+ 标签回流训练
    enabled: true
    auto-train: true        # 标签达标后自动训练
    min-labels: 100         # 首次训练所需最少标签数
    min-new-labels: 20      # 距上次训练新增标签触发线
    max-labels: 20000       # 标签存储上限
  fusion:
    # AI 融合分权重（个人/全局/监督，缺项自动重归一）
    personal-weight: 0.35
    global-weight: 0.35
    supervised-weight: 0.30
  decision:
    # AI 融合分决策线
    watch-threshold: 0.50   # ≥ 此值：静默标记（仅记入审计留痕，不触发处罚动作）
    alert-threshold: 0.90   # ≥ 此值：注入 RCP 高置信链路（由决策中心分级处置）

# ==============================================================
# 游戏内管理界面（/ac config）
# ==============================================================
# 六层菜单：主菜单 → 在线玩家列表 → 玩家详情 → 封禁时长
#                       └→ 封禁名单 → 封禁详情（解封）
# 需求权限：anticheat.admin / anticheat.config
gui:
  enabled: true                      # 关闭后 /ac config 会提示已禁用
  title-prefix: "§8AAC"              # 所有菜单标题前缀
  filler-material: "BARRIER"         # 边框/空位填充物（1.8 与 1.21 均存在；可换 STAINED_GLASS_PANE/GLASS 等）
  ban-reason: "管理员通过管理界面封禁"   # GUI 封禁时写入的原因
  kick-reason: "§c你已被管理员移出服务器" # GUI「踢出服务器」的踢出提示

# ==============================================================
# 验证码（/captcha）
# ==============================================================
# /captcha 每次只随机抽 1 个检测项（在下面 tasks 里 enabled=true 的项中等概率抽取）。
captcha:
  time-limit: 45                     # 整场验证码总时限（秒）
  new-player-enabled: false          # 是否对首次进入服务器的新玩家自动发起验证码
  tasks:
    # 检测项一：定向交互 —— 5 只不同颜色的羊，注视指定颜色的那只后按下潜行
    direct-interaction:
      enabled: true
    # 检测项二：动作模仿 —— 随机动作序列直接打在聊天框，玩家照做，DTW 对齐判定
    motion-mimicry:
      enabled: true
      min-actions: 3                 # 题目最短动作数
      max-actions: 4                 # 题目最长动作数
      max-attempts: 2                # 总计挑战次数（1 = 不给重试；注意与 time-limit 的预算关系）
      max-distance: 0.17             # DTW 归一化距离阈值，越小越严格（实测 0.14~0.18 分离度最好）
      duration-weight: 0.0           # 动作时长占比在代价里的权重。0 = 只看"做了哪些动作、顺序对不对"，
                                     #  人类做得快/慢、停顿长短都不影响判定（推荐保持 0）
      missing-penalty: 1.0           # 漏做一个模板动作的代价（强作弊信号 → 严判）
      extra-penalty: 0.5             # 玩家多做一个动作的代价（多为误触 → 容忍，避免误杀真人）
      turn-commit-degrees: 30        # 累计转身超过该角度才算一次"转向"动作（放宽，别让玩家转不够就被判"漏做"）
      turn-rate-threshold: 1.0       # 单 tick 偏航超过该角度视为"正在转身"
      min-action-ms: 150             # 短于该时长的动作忽略（只用于滤手抖 / 误触，不是"要求做满多久"）
      min-move-blocks: 0.5           # 行走 / 疾跑算作一个动作的最短位移
      window-multiplier: 2.2         # 采集窗口 = 动作数对应的时间预算 × 该系数 + 2.5 秒
      window-min-ms: 6000            # 采集窗口下限（毫秒）
      window-max-ms: 14000           # 采集窗口上限（毫秒）

# ==============================================================
# 核心层（Grim 式架构，com.anticheat.core）
# ==============================================================
# 与旧 detection 模块并存的独立反作弊内核：平台抽象 + 事件总线 + 每玩家状态容器
# + 注解驱动的 Check 框架 + PacketEvents 包层。
# 这里的默认值必须与 CoreConfigManager.kt 里的默认值逐字一致——
# 否则管理员删掉某个键会静默改变行为（本项目历史上踩过这个坑）。
core:
  enabled: true                      # 核心层总开关。false = 完全退回旧的 detection 引擎
  debug: false                       # 调试日志。开启后终端打印核心层生命周期与逐包摘要
  experimental-checks: false         # 实验性检测总闸。@CheckData(experimental=true) 的检测需此开关才参与判定

  # ---------------- 告警 ----------------
  alerts:
    enabled: true                    # 是否向有权限的玩家广播违规告警
    permission: "anticheat.notify"   # 接收告警所需权限
    min-interval-ms: 1000            # 同一玩家两次同检测告警的最小间隔（毫秒），防刷屏
    prefix: "§8[§cAAC§8] §7"          # 告警行前缀
    verbose: false                   # 冗余模式：告警附带检测内部调试信息

  # ---------------- 处罚 ----------------
  punishment:
    enabled: true                    # 总开关。true = 按下面的阶梯真处罚（2026-09-22 按服主要求开启）
    threshold: 20.0                  # 仅在**没配阶梯**（ladder 为空）时生效：VL 到该值即按 action 处理
    action: "kick"                   # 处罚动作：kick / ban / command（command 需在命令模板里用 %player%）
    cooldown-ms: 30000               # 同一玩家两次处罚的最小间隔（毫秒）
    kick-message: "§c反作弊检测到异常行为（%check% VL=%vl%）"   # 支持 %check% / %vl% / %player% 占位符
    # action=command 时执行的命令（不带斜杠）。支持 %player% / %check% / %vl% / %duration%
    command-template: "ban %player% 反作弊检测：%check% VL=%vl%"

    # 惩罚阶梯：按“这是该玩家第几次被抓”逐级升档（第 1 次踢、第 2 次封 1 天…）。
    #   min-vl 是**该档的证据门槛**：越重的处罚要求越高的违规分（VL）。
    #   第 N 次被抓时只在**前 N 档**里挑“VL 够格”的最高一档：第 3 次被抓但 VL 只有 9 时退回第 1 档，
    #   不会凭空给重罚（证据不够就不给重刑）。
    #   ⚠ 为什么按次数而不按 VL 分档：VL 是**会话内**的量，被踢下线重连即归零。
    #     若按 VL 分档，“踢”一触发玩家就走了，后面的封禁档永远到不了（踢—重连—再踢）。
    #   动作：alert（只告警）/ kick / ban（写库封禁 + 踢出）/ command（执行下面的命令模板）
    #   duration 只在 ban 时用：30s / 10m / 2h / 7d / 1w，或 perm（省略 = 永久）；写错会在日志里报“配置写错”并按永久处理
    #   空列表 = 不分档：超 threshold 就按上面的 action 处理
    #   ⚠ 启动时若数据库里的阶梯为空，会用这份播种；之后以数据库为准。
    #     想让 config 重新覆盖：清空 punishment_ladder 表后执行 /ac reload。
    #   ⚠ 不配 perm（永久）档：自动永久封一旦误判就是不可逆的损失，需要永久封请人工处理。
    ladder:
      - min-vl: 8.0
        action: "kick"
        reason: "反作弊检测到异常行为（%check% VL=%vl%）"
      - min-vl: 10.0
        action: "ban"
        duration: "1d"
        reason: "反作弊检测到异常行为（%check% VL=%vl%），第 2 次：封禁 1 天"
      - min-vl: 12.0
        action: "ban"
        duration: "7d"
        reason: "反作弊检测到异常行为（%check% VL=%vl%），第 3 次：封禁 7 天"
  # ---------------- 白名单 ----------------
  # 命中白名单的玩家豁免全部检测（不记违规、不处罚）；登录时查数据库。
  # 这里是声明式白名单：启动 / /ac reload 时把库里缺失的条目补进去，
  # 已存在的不重复、不修改、不删除（要撤销请在库里删行，或用 expires-in 让它自然过期）。
  # 两种写法可混用：
  whitelist: []
  # 例：
  # whitelist:
  #   - "Notch"                                        # 名字
  #   - "069a79f4-44e9-4726-a5be-fca90e38aaf5"         # UUID
  #   - name: "Builder"
  #     reason: "建筑组"
  #     expires-in: "30d"                              # 省略 = 永久

  # ---------------- 逐检测覆盖 ----------------
  # 键名 = @CheckData 的 name。enabled=false 可单独关掉某项；
  # decay 越大违规分衰减越快；setback 阈值 >0 时该项才会触发位置拉回。
  # 除这三项外，个别检测还读自己的专属参数（见各项注释），
  # 这些键不写就等于用代码里的默认值，删掉不会报错也不会改变行为。
  #
  # ⚠ 新增检测后必须在这里补一条：漏了不会报错，但管理员会看不到、也关不掉它。
  checks:
    # ---- 协议非法数据（原版客户端不可能产生的值）----
    BadPacketsA:
      enabled: true
      decay: 0.05
      setback: 0.0
    BadPacketsB:
      enabled: true
      decay: 0.05
      setback: 0.0
    # 松开右键包携带非 DOWN 作用面
    BadPacketsC:
      enabled: true
      decay: 0.05
    # 连续收到相同手持槽位（原版只在变化时才发）
    BadPacketsD:
      enabled: true
      decay: 0.1

    # ---- 背包与窗口 ----
    # 未开窗却点击容器
    InventoryA:
      enabled: true
      decay: 0.05
    # 拾取后 100ms 内换入副手（自动图腾；仅 1.9+ 生效）
    InventoryB:
      enabled: true
      decay: 0.05

    # ---- 收包频率（计时器）----
    # 移动包持续快于原版（时钟加速）
    # buffer-ms: 允许的时间欠账额度。网络抖动大的服务器可上调到 2000~4000，
    #            但每上调 1000ms 就多给作弊器约 1 秒的伪装空间。
    # 骑乘与滑翔会自动让路（由服务端读出的 vehicle / isGliding 判定），无需手工关闭。
    TimerA:
      enabled: true
      decay: 0.05
      buffer-ms: 1000
    # 移动包出现连续长间隔（客户端攒包 / blink）
    TimerB:
      enabled: true
      decay: 0.1

    # ---- 自动点击 ----
    # 间隔标准差长期过低（仅 1.13 以下客户端生效，见 AutoClickerA.kt 说明）
    AutoClickerA:
      enabled: true
      decay: 0.05
    # 间隔取值过于单一（香农熵过低；仅 1.13 以下客户端生效）
    AutoClickerB:
      enabled: true
      decay: 0.05
    # 每秒攻击次数超限（所有客户端版本生效）
    # max-cps: 一秒内攻击次数的上限，**达到即违规**（不是"超过才违规"）。
    #          人类极限约 12~15 且无法持续，默认 20；原版 1.8 左键冷却 10 tick，
    #          20 tick 窗口内最多出手 2~3 次，所以 20 这个线对正常玩家极宽松。
    #          想放宽请上调这个值本身——旧实现写的是"超过才违规"，
    #          于是恰好等于 20 会被放行，等于给"把频率精确压在阈值上"留了通路。
    #          设为 0 或负数即关闭判定（保留统计）。
    AutoClickerC:
      enabled: true
      decay: 0.1
      max-cps: 20
    # 连续多个 tick 不间断发送攻击包（机械连击 / KillAura 连发）。
    # 只数「哪些 tick 发出了攻击包」，不依赖客户端时序，因此对**全客户端版本**生效
    # ——这正是 AutoClickerA/B 因版本门跳过 1.13+ 客户端后留下的那块盲区。
    # 判据依据：原版 1.8 客户端左键有 10 tick 冷却，正常玩家不可能连续 6 拍都出手。
    # ⚠ 首次上线建议先 calibrate: true 观察：1.13+ 客户端经 ViaVersion 连进来时，
    #   攻击冷却是否被客户端禁用取决于具体实现，必须先看到真实玩家的"最长连续段"
    #   分布，再决定是收紧阈值还是维持默认。
    # calibrate: 打开后每 calibrate-windows 个窗口（40 tick/窗口）打印一次实测的
    #            最长连续段 / 违规级别峰值 / 攻击 tick 数。
    AutoClickerD:
      enabled: true
      decay: 0.1
      calibrate: false
      calibrate-windows: 150

    # ---- 瞄准 ----
    # 攻击期间朝向增量过于均匀（机械瞄准 / 平滑 aimbot）
    AimA:
      enabled: true
      decay: 0.05
    # 对准移动目标的长期命中率（瞄准质量）。⚠ experimental：
    # 必须同时打开 core.experimental-checks 才会参与判定。
    # 三个门槛必须同时满足：攻击数 >= min-attacks、窗口内目标累计位移 >= min-target-travel、
    # 命中率 >= min-hit-rate。目标的位移门槛是必需的——打挂机/卡住的对手天然 100% 命中。
    # min-hit-rate 的合理值取决于你的玩法与玩家水平，无法离线建模：
    # 请先开只告警模式（core.punishment.enabled: false）观察一到两周的实测分布再决定。
    AimB:
      enabled: true
      decay: 0.05
      min-attacks: 60
      min-hit-rate: 1.0
      min-target-travel: 25.0
    # 单帧把准星瞬移到目标（snap aim / 暴力瞬转）。
    # 补的是 AimA 的盲区：AimA 统计「|Δyaw| 的标准差」，抓"每拍增量几乎相同"的
    # 平滑瞄准；而瞬转是"大部分拍根本不动、偶尔一拍跳几十上百度"，
    # 其增量标准差极大——两类瞄准辅助在同一个统计量上互为反面，只做一个必然漏另一个。
    # 判据：三拍指纹「静止(<9°) → 突跳(>40°) → 静止(<9°)」，且必须紧贴攻击/挥手
    #      （这道门是必需的：没有它，赶路时的一次快速甩头也会进判定）。
    # 单帧大角度转向本身不违规——甩枪是 PVP 基本功——所以单次只记 7~50 分证据，
    # 累积到 60 分才告警，且每 tick 降温 0.3（10 秒无新证据即归零）。
    AimC:
      enabled: true
      decay: 0.05

    # ---- 伸手与视线（射线类）----
    # 攻击距离超限。已做延迟补偿：在玩家与目标各自最近 8 tick 的位置之间取最小距离，
    # 并且只累积证据、不单次判定；骑乘 / 滑翔 / 传送窗口 / 刚登录 / 延迟 >400ms 一律不判。
    # 阈值 = max-reach + 有效容差，有效容差按延迟分段（低延迟 0.35 / 400ms 0.80）：
    #   tolerance  = 低延迟档的基础容差；ping-slack = 高延迟档的额外放宽量（0 = 固定容差）。
    #   分段而不是用单一常量，是因为"收紧漏判"与"放松误报"在两端各占一半。
    #   取值不是估的：ReachCalibrationTest 用真实算法复算了静止/冲刺/跳跃/横移等
    #   场景 × 0~400ms 延迟，标定表里"余量"一栏就是收紧空间（详见该测试的类注释）。
    #   max-reach: 原版生存模式上限，一般不需要改。
    # calibrate: 标定模式。打开后每 calibrate-interval-seconds 秒打印一次实测距离的
    #   n/p50/p95/p99/max 与"距阈值还有多远"，用于在真实服务器上核对阈值——
    #   **改 tolerance 之前请先让标定模式跑几个周期**。
    ReachA:
      enabled: true
      decay: 0.05
      max-reach: 3.0
      tolerance: 0.40
      ping-slack: 0.45
      calibrate: false
      calibrate-interval-seconds: 300
    # 攻击了完全不在视线内的实体（silent aura / 无视线攻击）。
    # 原版要求准星落在命中盒上（约 10 度），这里默认给到 75 度，
    # 只抓"目标明显在侧面或背后"这类明确作弊，避免把"快速转身瞬间命中"误判。
    # 想更严可下调 max-angle，一次只降 5~10 度。
    ReachB:
      enabled: true
      decay: 0.05
      max-angle: 75

    # ---- 战斗动作 ----
    # 攻击了却没有挥手包（silent aura / 隐藏挥臂）
    NoSwingA:
      enabled: true
      decay: 0.1
    # 挖掘开始后 1 tick 内切换手持槽位（自动换工具）
    ToolSwitchA:
      enabled: true
      decay: 0.1

    # ---- 移动 ----
    # 空中垂直运动不满足重力递推（悬停 / 匀速上升式飞行）。
    # 判据是逐 tick 比对「实测 Y 增量」与「原版重力递推值 (上一拍 - 0.08) * 0.98」，
    # 只在**下落得不够快**时累积证据——跳跃、自由落体、被炸飞后回落都不会命中。
    # tolerance: 观测误差容差（格/tick）。服务端每 tick 读一次位置，而客户端发包时刻
    #            与 tick 边界不对齐，默认 0.03 约为单 tick 重力的 40%。
    # grace-ticks: 腾空宽限期。离开地面的第一拍没有可比的"上一拍空中增量"，必须跳过；
    #            原版起跳的上升段是 6 tick，默认 4 只盖住过渡拍（上升段本身满足递推）。
    # setback: >0 时该项会触发位置拉回。默认 0（只告警/处罚，不干预），
    #          确认自己的服务器没有误报后再开——飞行拉回的体感很突兀。
    # ⚠ 创造 / 旁观 / 插件授予的飞行会自动让路（读服务端 getAllowFlight），无需手工关闭。
    FlyA:
      enabled: true
      decay: 0.05
      setback: 0.0
      tolerance: 0.03
      grace-ticks: 4
    # 声称站在地面上却在快速下坠，且脚下没有支撑（NoFall 免摔）。
    # 三条同时成立才判：声称落地 + 单 tick 下降超上限 + 脚下探测深度内没有固体方块。
    # 第三条是关键——少了它，下降的活塞与飞行机器（玩家真的站在方块上）会被误判。
    # max-grounded-descent: "踩着地面还能下降"的单 tick 上限。原版自动上台阶高度是 0.6，
    #                 走下台阶 / 半砖就在这个量级，默认 0.7 留了余量。
    # support-probe-depth: 向下探测支撑的格数。要覆盖"站在方块顶面"（最多差 1 格），
    #                 又不能大到"离地还有两三格也算有支撑"（那会放过落地前的整段坠落）。
    GroundSpoofA:
      enabled: true
      decay: 0.05
      max-grounded-descent: 0.7
      support-probe-depth: 1.5
    # 疾跑状态下水平位移方向与朝向严重偏离（全向疾跑 / KeepSprint）。
    # 原版疾跑只能由前进输入维持，斜向输入（W+A / W+D）的极限是 45 度。
    # max-angle: 允许的夹角。默认 75 = 斜向极限 45 再留 30 度余量，用来吸收转身的一拍错位。
    #            想更严请**每次只降 5~10 度**：这个判据的假阳性全部来自转身瞬间。
    # ⚠ 击退会让玩家看起来"倒着疾跑"，已用「服务端施加外力后的免疫窗口」整体让路。
    SprintA:
      enabled: true
      decay: 0.05
      max-angle: 75
    # 水平速度持续超出物理上限（Speed / LongJump）。⚠ experimental：
    # 必须同时打开 core.experimental-checks 才会参与判定。
    # 之所以是实验性的：原版允许的速度**取决于脚下是什么**——普通地面疾跑跳跃约 0.42，
    # 而蓝冰上连续疾跑跳跃能稳定超过 1.0 且是持续的。要把阈值压到能抓住 0.5~0.8 的
    # Speed 模式，就必须有方块与碰撞模型（本仓库的预测引擎还是骨架）。
    # max-speed-per-tick: 默认 1.3，明显高于蓝冰常见上限。抓的是 LongJump / YPort
    #            与较激进的几档 Speed，代价是漏掉贴地小幅加速。**下调前请先标定**。
    # calibrate: 打开后每 calibrate-interval-seconds 秒打印一次实测的 n/avg/max
    #            与"距上限还有多远"，用于在真实服务器上核对阈值。
    SpeedA:
      enabled: true
      decay: 0.05
      max-speed-per-tick: 1.3
      calibrate: false
      calibrate-interval-seconds: 300
    # 持续超速：滑动窗口（20 tick）的**平均水平速度**超限。
    # 与 SpeedA 互补而不是替代：SpeedA 判逐次位移，对单拍尖峰敏感，因此只能保持
    # 实验性——单拍极值里混着"客户端攒包把多拍位移合并成一包"的噪声（实测单拍峰值
    # 2.05 格/tick，而同一段的 20 拍平均只有 0.75），拿它判定必然误报。
    # 本检测取窗口平均，把这类噪声天然摊平，于是能默认启用，专心抓
    # "每一拍都比原版快"的持续超速（Speed / LongJump）。
    # max-avg-speed-per-tick: 默认 1.5。实测合法窗口平均 ≤ 0.75
    #            （普通地面疾跑 0.256，与理论值 0.28 吻合），留了约 2 倍余量。
    #            ⚠ 唯一现实的误报来源是蓝冰长途交通（可稳定超过 1.0）：
    #            上线前先用 calibrate: true 看冰道玩家的实测分布再决定。
    SpeedB:
      enabled: true
      decay: 0.05
      max-avg-speed-per-tick: 1.5
      calibrate: false
      calibrate-interval-seconds: 300
    # 容器窗口打开期间持续产生水平位移（InventoryMove）。
    # 原版在任何容器界面打开时都会忽略移动输入，只判**水平**位移（开窗时重力照常生效，
    # 站在高处开箱会正常下坠）。累积的是"走过的距离"，被撞一下的 0.2~0.3 格会被降温吸收。
    # min-tick-movement: 单 tick 计入证据的最小位移。原版行走 0.1 / 疾跑 0.13，
    #            默认 0.06 让两者都计入，而被推动后的滑行会在两三拍内掉到它以下。
    # flag-balance: 累积多少格才告警，默认 2.0 ≈ 正常走路的 1 秒。
    # ⚠ 已知盲区：玩家自己的背包（E 键）不产生 OPEN_WINDOW，服务端不知情，
    #   因此只覆盖容器（箱子 / 熔炉 / 工作台 / 商人 / 潜影盒 / 马匹背包…）。
    InventoryMoveA:
      enabled: true
      decay: 0.05
      min-tick-movement: 0.06
      flag-balance: 2.0

    # ---- 世界交互 ----
    # 同一方块被反复重启挖掘（fastbreak / nuker）
    BreakRestartA:
      enabled: true
      decay: 0.05
    # 放置方块频率异常（fastplace）
    # max-per-second: 一秒内允许的放置次数。原版右键冷却远低于 20/s，
    #                 默认 15 已留约 3 倍余量；设为 0 或负数即关闭判定。
    FastPlaceA:
      enabled: true
      decay: 0.1
      max-per-second: 15
    # 蜜罐命中（幻象矿石 / 假掉落 / 不可能破坏进度 / 假逃脱）。
    # 由 listeners/HoneypotListener 外部上报，不是包驱动。
    # decay 刻意写 0：蜜罐是"近乎确认性"的判据，没有对应的合规动作可以降温；
    # 违规分是会话内的量（单次命中 0.5~1.0 分，第一档要 min-vl: 8），
    # 跨会话升档看 violation.punished 的条数，所以不衰减不会造成误封。
    HoneypotA:
      enabled: true
      decay: 0.0
    # 大范围瞬间破坏（nuker）。BreakRestartA 只看「同一个方块被反复重启」，
    # 而 nuker 是对周围每个方块各下手一次，每个坐标只出现一次，那条判据看不到。
    # max-starts-per-tick: 单 tick 允许的 START_DIGGING 次数。理论上就是 1，
    #                 默认 3 是为了容忍「瞬间破坏方块 + 抖动/蝴蝶点击」的组合；
    #                 下调到 1 会把抖动点击挖火把判成作弊。创造模式整体让路。
    # max-angle: 挖掘的方块允许偏离视线多少度。几何上限只有约 13 度（方块 1 格、
    #                 交互距离 4.5 格），默认 60 度用来吸收转身与眼睛位置的一拍错位。
    NukerA:
      enabled: true
      decay: 0.05
      max-starts-per-tick: 3
      max-angle: 60

