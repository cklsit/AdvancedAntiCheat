  # ---- 七、蜜罐类 ----
  x_ray:
    enabled: true
    maxViolations: 2
    banTime: "14d"
  chest_esp:
    enabled: true
    maxViolations: 2
    banTime: "7d"
  player_radar:
    enabled: true
    maxViolations: 2
    banTime: "7d"
  tracer:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  fake_drop:
    enabled: true
    maxViolations: 2
    banTime: "7d"
  fake_escape:
    enabled: true
    maxViolations: 2
    banTime: "7d"

  # ---- 八、行为分析类 ----
  behavior_anomaly:
    enabled: true
    maxViolations: 5
