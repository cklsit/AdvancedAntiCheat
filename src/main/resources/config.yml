# 通知节流：同类反作弊提示对同一玩家的最小重复发送间隔（毫秒）
# 用于防止聊天栏刷屏；不影响实际处罚动作（封禁/验证码/监控仍会立即执行）
notify:
  throttleMs: 2000

detection:
  # 各检测项通用字段：
  #   enabled                是否启用该检测
  #   maxViolations          触发封禁前允许的最大违规数
  #   banTime                封禁时长（"30m"/"1h"/"6h"/"1d"/"7d"/"permanent"）
  #   kickThreshold          达到该违规数时踢出玩家
  #   humanReviewThreshold   达到该违规数时升级人工审核
  #   warningCooldownSecs    警告消息冷却（秒），避免同类刷屏
  #   notifyCooldownMs       检测通知冷却（毫秒），控制 DecisionActionCenter 提示频率
  fly:
    enabled: true
    maxViolations: 5
    banTime: "1h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  speed:
    enabled: true
    maxViolations: 5
    banTime: "30m"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  esp:
    enabled: true
    maxViolations: 3
    banTime: "6h"
    kickThreshold: 15
    humanReviewThreshold: 10
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  killaura:
    enabled: true
    maxViolations: 5
    banTime: "1d"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  reach:
    enabled: true
    maxViolations: 5
    banTime: "2h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000

  # ============ 全项检测重构新增检测项（按违规类型名作为配置键） ============
  # 说明：下方键名对应 ViolationRecord.ViolationType 枚举名的小写形式，
  # 由违规上报链路（managers.ViolationManager → DetectionManager.addViolation）读取，
  # 用于控制封禁阈值与开关。每个键支持 enabled / maxViolations / banTime 等通用字段。

  # ---- 一、移动类 ----
  timer:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  water_walk:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  high_jump:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  no_fall:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  spider:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  phase:
    enabled: true
    maxViolations: 2
    banTime: "permanent"
  jesus:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  clock_drift:
    enabled: true
    maxViolations: 3
    banTime: "7d"

  # ---- 二、战斗类 ----
  auto_hit:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  cps_anomaly:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  no_knockback:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  auto_totem:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  aim_angle:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  aimbot_spectrum:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  knockback_entropy:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  anti_knockback:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_armor:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_potion:
    enabled: true
    maxViolations: 4
    banTime: "3d"

  # ---- 三、挖掘与建筑类 ----
  fast_break:
