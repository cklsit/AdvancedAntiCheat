    banTime: "3d"
  aimbot_spectrum:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  knockback_entropy:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  anti_knockback:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_armor:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  auto_potion:
    enabled: true
    maxViolations: 4
    banTime: "3d"

  # ---- 三、挖掘与建筑类 ----
  fast_break:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  auto_miner:
    enabled: true
    maxViolations: 2
    banTime: "permanent"
  break_consistency:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  mining_coord:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  illegal_place:
    enabled: true
