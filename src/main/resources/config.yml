# 玩家提示节流：控制 DecisionActionCenter 向玩家发送聊天提示的频率。
# 重要：节流只影响"聊天栏文字"，不影响实际处罚动作（封禁/验证码/监控一律照常立即执行）。
notify:
  # 绝对下限（毫秒）：任何提示对同一玩家的最小间隔，优先级最高。
  throttleMs: 5000
  # 以下为"同一档位持续存在时的重复提示间隔"（秒）；档位升高（升级）时会立即提示，不受此限制。
  # 设为 0 表示该档位只提示一次，之后不再重复（推荐：监控/正常 档位设为 0 可彻底消除刷屏）。
  normalRepeatSecs: 0
  monitorRepeatSecs: 0
  captchaRepeatSecs: 60
  tempBanRepeatSecs: 300
  banRepeatSecs: 600

detection:
  # 各检测项通用字段：
  #   enabled                是否启用该检测
  #   maxViolations          触发封禁前允许的最大违规数
  #   banTime                封禁时长（"30m"/"1h"/"6h"/"1d"/"7d"/"permanent"）
  #   kickThreshold          达到该违规数时踢出玩家
  #   humanReviewThreshold   达到该违规数时升级人工审核
  #   warningCooldownSecs    警告消息冷却（秒），避免同类刷屏
  #   notifyCooldownMs       检测通知冷却（毫秒），控制 DecisionActionCenter 提示频率
  fly:
    enabled: true
    maxViolations: 5
    banTime: "1h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  speed:
    enabled: true
    maxViolations: 5
    banTime: "30m"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  esp:
    enabled: true
    maxViolations: 3
    banTime: "6h"
    kickThreshold: 15
    humanReviewThreshold: 10
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  killaura:
    enabled: true
    maxViolations: 5
    banTime: "1d"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  reach:
    enabled: true
    maxViolations: 5
    banTime: "2h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000

  # ============ 全项检测重构新增检测项（按违规类型名作为配置键） ============
  # 说明：下方键名对应 ViolationRecord.ViolationType 枚举名的小写形式，
  # 由违规上报链路（managers.ViolationManager → DetectionManager.addViolation）读取，
  # 用于控制封禁阈值与开关。每个键支持 enabled / maxViolations / banTime 等通用字段。

  # ---- 一、移动类 ----
  timer:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  water_walk:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  high_jump:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  no_fall:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  spider:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  phase:
    enabled: true
    maxViolations: 2
    banTime: "permanent"
  jesus:
    enabled: true
    maxViolations: 3
    banTime: "1d"
  clock_drift:
    enabled: true
    maxViolations: 3
    banTime: "7d"

  # ---- 二、战斗类 ----
  auto_hit:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  cps_anomaly:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  no_knockback:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  auto_totem:
    enabled: true
    maxViolations: 3
    banTime: "7d"
  aim_angle:
