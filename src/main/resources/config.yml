  offhand_swap:
    enabled: true
    maxViolations: 4
    banTime: "3d"
  inventory_dupe:
    enabled: true
    maxViolations: 1
    banTime: "permanent"

  # ---- 五、网络与协议类 ----
  protocol_spoof:
    enabled: true
