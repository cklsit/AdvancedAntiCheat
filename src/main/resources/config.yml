  # ---- 六、客户端与环境指纹类 ----
  gui_fingerprint:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  render_distance:
    enabled: true
    maxViolations: 2
    banTime: "permanent"

  # ---- 七、蜜罐类 ----
  x_ray:
    enabled: true
    maxViolations: 2
    banTime: "14d"
  chest_esp:
    enabled: true
