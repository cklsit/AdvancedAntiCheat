name: Nightly Release

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: true
        default: 'Manual nightly release'

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  BUILD_REPORT_DIR: 'build-reports'

jobs:
  nightly-release:
    runs-on: ubuntu-latest
    name: Nightly Release
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <mirrors>
              <mirror>
                <id>aliyunmaven</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
              <mirror>
                <id>aliyunmaven-public</id>
                <mirrorOf>public</mirrorOf>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>" > ~/.m2/settings.xml

      - name: Get existing nightly release tags
        id: get-tags
        run: |
          echo "=== Getting existing nightly release tags ==="
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v2.0.*-beta" HEAD 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            echo "No existing nightly release tags found"
            echo "MAX_PATCH=0" >> $GITHUB_OUTPUT
          else
            echo "Last nightly tag: $LAST_TAG"
            MAX_PATCH=$(echo "$LAST_TAG" | sed -n 's/^v2\.0\.\([0-9]*\)-beta$/\1/p')
            echo "Current max patch version: $MAX_PATCH"
            echo "MAX_PATCH=$MAX_PATCH" >> $GITHUB_OUTPUT
          fi

      - name: Calculate next version number
        id: calc-version
        run: |
          CURRENT_PATCH=${{ steps.get-tags.outputs.MAX_PATCH }}
          NEXT_PATCH=$((CURRENT_PATCH + 1))
          VERSION="v2.0.${NEXT_PATCH}"
          TAG_NAME="${VERSION}-beta"
          echo "Current patch: $CURRENT_PATCH"
          echo "Next patch: $NEXT_PATCH"
          echo "Version: $VERSION"
          echo "Tag name: $TAG_NAME"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Get last nightly release commit
        id: last-release-commit
        run: |
          # Find the last beta tag in the history
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v2.0.*-beta" HEAD 2>/dev/null || echo "")
          echo "Last beta tag: $LAST_TAG"
          
          if [ -z "$LAST_TAG" ]; then
            echo "No previous nightly release found"
            echo "LAST_COMMIT=" >> $GITHUB_OUTPUT
            echo "LAST_TAG=" >> $GITHUB_OUTPUT
          else
            LAST_COMMIT=$(git rev-parse "$LAST_TAG" 2>/dev/null || echo "")
            echo "Last release commit: $LAST_COMMIT"
            echo "LAST_COMMIT=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "LAST_TAG=$LAST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Check for new commits
        id: check-changes
        run: |
          LAST_COMMIT="${{ steps.last-release-commit.outputs.LAST_COMMIT }}"
          CURRENT_COMMIT="${{ github.sha }}"
          
          echo "Last release commit: $LAST_COMMIT"
          echo "Current commit: $CURRENT_COMMIT"
          
          if [ -z "$LAST_COMMIT" ]; then
            echo "No previous release, proceeding"
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          else
            # Count commits between last release and HEAD
            COMMIT_COUNT=$(git rev-list "${LAST_COMMIT}..HEAD" --count 2>/dev/null || echo "0")
            echo "Commits since last release: $COMMIT_COUNT"
            
            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "No new commits since last release - skipping"
              echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
            else
              echo "New commits found: $COMMIT_COUNT"
              echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Exit if no changes
        if: steps.check-changes.outputs.HAS_CHANGES == 'false'
        run: |
          echo "::notice::No new commits since last nightly release. Exiting."
          exit 0

      - name: Get commit changes for release notes
        id: get-changes
        run: |
          LAST_TAG="${{ steps.last-release-commit.outputs.LAST_TAG }}"
          
          echo "Last release tag: $LAST_TAG"
          
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release, getting recent commits"
            CHANGES=$(git log --oneline --no-merges -10)
          else
            echo "Getting changes since $LAST_TAG"
            CHANGES=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges 2>/dev/null)
          fi
          
          echo "=== Commit changes ==="
          echo "$CHANGES"
          echo "=== End changes ==="
          
          CHANGE_LIST=""
          COUNT=1
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              COMMIT_DESC=$(echo "$line" | sed 's/^[0-9a-f]*\s*//')
              ENTRY=$(printf "  %d. %s" "$COUNT" "$COMMIT_DESC")
              if [ -z "$CHANGE_LIST" ]; then
                CHANGE_LIST="$ENTRY"
              else
                CHANGE_LIST=$(printf "%s\n%s" "$CHANGE_LIST" "$ENTRY")
              fi
              COUNT=$((COUNT + 1))
            fi
          done <<< "$CHANGES"
          
          echo "=== Change list ==="
          echo "$CHANGE_LIST"
          echo "=== End change list ==="
          
          echo "CHANGE_LIST<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build project (Paper profile)
        id: build
        run: |
          echo "=== Building project ==="
          mvn clean package -DskipTests -q -Ppaper
          if [ $? -eq 0 ]; then
            echo "Build successful"
            echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT
          else
            echo "Build failed"
            echo "BUILD_SUCCESS=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Rename JAR file
        id: rename-jar
        run: |
          VERSION="${{ steps.calc-version.outputs.VERSION }}"
          JAR_NAME="AdvancedAntiCheat-${VERSION}-beta.jar"
          
          echo "Renaming JAR to: $JAR_NAME"
          cp target/AdvancedAntiCheat-*.jar "target/$JAR_NAME"
          echo "RENAMED_JAR=target/$JAR_NAME" >> $GITHUB_OUTPUT
          ls -la target/$JAR_NAME

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION="${{ steps.calc-version.outputs.VERSION }}"
          TAG_NAME="${{ steps.calc-version.outputs.TAG_NAME }}"
          CHANGE_LIST="${{ steps.get-changes.outputs.CHANGE_LIST }}"
          RUN_ID="${{ github.run_id }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref }}"
          
          DATE=$(date '+%Y-%m-%d')
          BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "WARNING! This is a nightly release (beta version) and may contain unstable features and bugs." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Nightly Release $VERSION-beta" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Release Date: $DATE" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Changes:" >> $GITHUB_OUTPUT
          echo "$CHANGE_LIST" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Build Info:**" >> $GITHUB_OUTPUT
          echo "- Build Time: $BUILD_TIME" >> $GITHUB_OUTPUT
          echo "- Build ID: $RUN_ID" >> $GITHUB_OUTPUT
          echo "- Commit Hash: $SHA" >> $GITHUB_OUTPUT
          echo "- Branch: $REF" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Version Notes:**" >> $GITHUB_OUTPUT
          echo "- Built with Paper API 1.21.11" >> $GITHUB_OUTPUT
          echo "- Compatible with Minecraft 1.8.x - 1.21.x" >> $GITHUB_OUTPUT
          echo "- For testing purposes only" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT

      - name: Create nightly release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc-version.outputs.TAG_NAME }}
          name: Nightly Release ${{ steps.calc-version.outputs.TAG_NAME }} (${{ steps.release-notes.outputs.DATE }})
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          prerelease: true
          files: ${{ steps.rename-jar.outputs.RENAMED_JAR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release creation
        if: success()
        run: |
          echo "::notice::Nightly release created successfully!"
          echo "Tag: ${{ steps.calc-version.outputs.TAG_NAME }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly release failed!"
          echo "Version attempted: ${{ steps.calc-version.outputs.TAG_NAME }}"
