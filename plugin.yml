name: AdvancedAntiCheat
version: 2.1.0
main: com.anticheat.AdvancedAntiCheat
api-version: 1.21
description: 高级反作弊插件，支持自动封禁、玩家举报系统、跨服务器数据库同步与内嵌 Web 管理面板
author: AntiCheatTeam
website: https://github.com/cklsit/AntiCheat

softdepend:
  - BungeeCord
  - Velocity
  - ProtocolLib

commands:
  report:
    description: 举报作弊玩家
    usage: /report <玩家> <原因>
    permission: anticheat.report
  goto:
    description: 传送至指定玩家身边（支持跨服传送）
    usage: /goto <玩家>
    permission: anticheat.goto
  ban:
    description: 封禁玩家（支持数据库同步）
    usage: /ban <玩家> <时间(可选)> <原因(可选)>
    permission: anticheat.ban
  unban:
    description: 解封玩家（支持数据库同步）
    usage: /unban <玩家>
    permission: anticheat.unban
  anticheat:
    description: 反作弊插件主指令
    usage: /anticheat <reload|stats|profile|config|help>
    permission: anticheat.admin
  ac:
    description: 反作弊插件快捷指令
    usage: /ac <reload|stats|profile|config|replay|help>
    permission: anticheat.admin
  checkclient:
    description: 对玩家进行客户端检查
    usage: /checkclient <玩家> <QQ号>
    permission: anticheat.checkclient
  checkdone:
    description: 解除玩家的检查状态（通过检查）
    usage: /checkdone <玩家>
    permission: anticheat.checkclient
  captcha:
    description: 对玩家发起验证码测试
    usage: /captcha <玩家|toggle|timelimit>
    permission: anticheat.captcha
  bounty:
    description: 漏洞赏金计划命令
    usage: /bounty <enter|leave|invite|report|lb|start|complete>
    permission: anticheat.bounty
  aac_replay_follow:
    description: 让观察者客户端跟随指定目标玩家
    usage: /aac_replay_follow <观察者名> <目标玩家名或UUID>
    permission: anticheat.replay.control
  aac_replay_unfollow:
    description: 停止观察者客户端跟随
    usage: /aac_replay_unfollow <观察者名>
    permission: anticheat.replay.control

permissions:
  anticheat.report:
    description: 允许使用举报功能
    default: true
  anticheat.goto:
    description: 允许传送至玩家
    default: op
  anticheat.ban:
    description: 允许封禁玩家
    default: op
  anticheat.unban:
    description: 允许解封玩家
    default: op
  anticheat.admin:
    description: 反作弊管理员权限
    default: op
  anticheat.notify:
    description: 接收举报通知
    default: op
  anticheat.checkclient:
    description: 允许进行客户端检查
    default: op
  anticheat.captcha:
    description: 允许使用验证码功能
    default: op
  anticheat.bounty:
    description: 允许使用漏洞赏金计划功能
    default: true
  anticheat.bounty.admin:
    description: 漏洞赏金计划管理员权限
    default: op
  anticheat.bounty.unlimited:
    description: 无限制沙箱时间
    default: op
  anticheat.replay.observer:
    description: 观察者客户端账号权限（免踢/免拦截）
    default: false
  anticheat.replay.control:
    description: 控制观察者跟随/解绑
    default: op
  anticheat.config:
    description: 允许使用 /ac config 游戏内管理界面
    default: op
  anticheat.whitelist:
    description: 允许通过管理界面增删可信白名单
    default: op
