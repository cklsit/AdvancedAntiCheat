name: AdvancedAntiCheat
version: 2.1.0
main: com.anticheat.AdvancedAntiCheat
api-version: 1.21
description: 高级反作弊插件，支持自动封禁、玩家举报系统、跨服务器数据库同步与游戏内管理界面
author: AntiCheatTeam
website: https://github.com/cklsit/AntiCheat

softdepend:
  - BungeeCord
  - Velocity
  - ProtocolLib

commands:
  report:
    description: 举报作弊玩家
    usage: /report <玩家> <原因>
    permission: anticheat.report
  goto:
    description: 传送至指定玩家身边（支持跨服传送）
    usage: /goto <玩家>
    permission: anticheat.goto
  ban:
    description: 封禁玩家（支持数据库同步）
    usage: /ban <玩家> <时间(可选)> <原因(可选)>
    permission: anticheat.ban
  unban:
    description: 解封玩家（支持数据库同步）
    usage: /unban <玩家>
    permission: anticheat.unban
  # 命令级权限用 anticheat.command（default: true）而不是 anticheat.admin：
  # /ac ranking 是"所有玩家可用"的只读子命令（文档要求），而 Bukkit 会在进入
  # executor 之前就用命令级权限拦掉普通玩家。管理子命令的权限校验在
  # AntiCheatCommand.onCommand 里**逐条**执行，所以降低命令级权限不会让
  # 任何管理功能对普通玩家开放；PluginYmlContractTest 也要求每个命令都声明权限。
  anticheat:
    description: 反作弊插件主指令
    usage: /anticheat <reload|stats|profile|config|ranking|help>
    permission: anticheat.command
  ac:
    description: 反作弊插件快捷指令（ranking 对所有玩家开放）
    usage: /ac <reload|stats|profile|config|ranking|help>
    permission: anticheat.command
  checkclient:
    description: 对玩家进行客户端检查
    usage: /checkclient <玩家> <QQ号>
    permission: anticheat.checkclient
  checkdone:
    description: 解除玩家的检查状态（通过检查）
    usage: /checkdone <玩家>
    permission: anticheat.checkclient
  captcha:
    description: 对玩家发起验证码测试
    usage: /captcha <玩家|toggle|timelimit>
    permission: anticheat.captcha
  bounty:
    description: 漏洞赏金计划命令
    usage: /bounty <enter|leave|board|shop|start|status|rank|cases|report|pending|accept|reject|invite|help>
    permission: anticheat.bounty

permissions:
  anticheat.report:
    description: 允许使用举报功能
    default: true
  anticheat.goto:
    description: 允许传送至玩家
    default: op
  anticheat.ban:
    description: 允许封禁玩家
    default: op
  anticheat.unban:
    description: 允许解封玩家
    default: op
  anticheat.admin:
    description: 反作弊管理员权限
    default: op
  anticheat.notify:
    description: 接收举报通知
    default: op
  anticheat.checkclient:
    description: 允许进行客户端检查
    default: op
  anticheat.captcha:
    description: 允许使用验证码功能
    default: op
  # 命令入口权限：允许执行 /ac 与 /anticheat 的**公开**子命令（目前只有 ranking）。
  # 管理子命令由 AntiCheatCommand 内部按 anticheat.admin 逐条校验。
  anticheat.command:
    description: 允许使用 /ac 的公开子命令（赏金排行等）
    default: true
  anticheat.bounty:
    description: 允许使用漏洞赏金计划功能
    default: true
  anticheat.bounty.admin:
    description: 漏洞赏金计划管理员权限
    default: op
  anticheat.bounty.unlimited:
    description: 无限制沙箱时间
    default: op
  anticheat.config:
    description: 允许使用 /ac config 游戏内管理界面
    default: op
  anticheat.whitelist:
    description: 允许通过管理界面增删可信白名单
    default: op
