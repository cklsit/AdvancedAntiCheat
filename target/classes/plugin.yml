name: AdvancedAntiCheat
version: 1.0.0
main: com.anticheat.AdvancedAntiCheat
api-version: 1.21
description: 高级反作弊插件，支持自动封禁和玩家举报系统
author: AntiCheatTeam
website: https://anticheat.example.com

commands:
  report:
    description: 举报作弊玩家
    usage: /report <玩家> <原因>
    permission: anticheat.report
  goto:
    description: 传送至指定玩家身边
    usage: /goto <玩家>
    permission: anticheat.goto
  ban:
    description: 封禁玩家
    usage: /ban <玩家> <时间(可选)> <原因(可选)>
    permission: anticheat.ban
  unban:
    description: 解封玩家
    usage: /unban <玩家>
    permission: anticheat.unban
  anticheat:
    description: 反作弊插件主指令
    usage: /anticheat <reload|stats|help>
    permission: anticheat.admin
  ac:
    description: 反作弊插件快捷指令
    usage: /ac <reload|stats|help>
    permission: anticheat.admin

permissions:
  anticheat.report:
    description: 允许使用举报功能
    default: true
  anticheat.goto:
    description: 允许传送至玩家
    default: op
  anticheat.ban:
    description: 允许封禁玩家
    default: op
  anticheat.unban:
    description: 允许解封玩家
    default: op
  anticheat.admin:
    description: 反作弊管理员权限
    default: op
  anticheat.notify:
    description: 接收举报通知
    default: op