Section "ServerLayout"
    Identifier "dummy_layout"
    Screen     0 "dummy_screen" 0 0
    InputDevice "dummy_mouse"    "CorePointer"
    InputDevice "dummy_keyboard" "CoreKeyboard"
EndSection

Section "Files"
    ModulePath "/usr/lib/xorg/modules"
    FontPath   "/usr/share/fonts/X11/misc"
    FontPath   "/usr/share/fonts/X11/Type1"
EndSection

Section "Module"
    Load  "extmod"
    Load  "glx"
    Load  "dbe"
    Load  "record"
    Load  "fb"
    Load  "shadow"
    Load  "fbdevhw"
    Load  "dri2"
    Load  "dri3"
    Load  "present"
EndSection

Section "InputDevice"
    Identifier  "dummy_keyboard"
    Driver      "kbd"
    Option      "XkbRules"   "xorg"
    Option      "XkbModel"   "pc105"
    Option      "XkbLayout"  "us"
EndSection

Section "InputDevice"
    Identifier  "dummy_mouse"
    Driver      "mouse"
    Option      "Protocol"    "auto"
    Option      "Device"      "/dev/input/mice"
    Option      "ZAxisMapping" "4 5"
EndSection

Section "Monitor"
    Identifier "dummy_monitor"
    HorizSync  28.0 - 100.0
    VertRefresh 48.0 - 80.0
    Modeline "1280x720_60.00"  74.50  1280 1344 1472 1664  720 723 728 748  -hsync +vsync
    Option     "PreferredMode" "1280x720_60.00"
EndSection

Section "Device"
    Identifier  "dummy_video"
    Driver      "dummy"
    # 给 dummy 虚拟出足够大的 24-bit 显存 (64 MB ≈ 1280x720 x 4 x 4 double buffer)
    Option      "VideoRam" "65536"
EndSection

Section "Screen"
    Identifier "dummy_screen"
    Device     "dummy_video"
    Monitor    "dummy_monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
        Virtual 1280 720
    EndSubSection
EndSection

Section "DRI"
    Mode 0666
EndSection

Section "Extensions"
    # 开启 GLX 扩展；Mesa/llvmpipe 会通过 swrast 提供 OpenGL
    Option "GLX" "Enable"
EndSection
